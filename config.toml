googleAnalytics = "G-CD46WL66JT"
baseURL = "https://solarplannerguide.com/"
enableGitInfo = true
languageCode = "en-us"
title = "Solar Planner Guide"
[pagination]
  pagerSize = 12
enableRobotsTXT = true
enableEmoji = true

[params]
author = "Stephen Brenish"
  description = "Plan your home solar installation with confidence - costs, tax credits, financing, and savings calculators explained clearly."
  niche = "Residential Solar & Home Energy"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "solar panels home rooftop energy"
  author = "Solar Planner Guide Editorial Team"
  logo_text = "Solar Planner Guide"
  tagline = "Plan Smart. Power Your Home."
  primary_color = "#2d6a4f"
  cloudflare_analytics = ""

  # Authority theme
  hero_color_1 = "#052e16"
  hero_color_2 = "#14532d"
  hero_color_3 = "#15803d"
  hero_color_4 = "#0f172a"
  monthly_readers = 38000
  research_hours  = 320
  satisfaction    = 97
  trust_extra     = "Certified solar advisors"
  impact_verification = ""
  impact_tracking_id  = ""
  persona_name       = "Derek Sato"
  persona_title      = "Solar Energy Research Editor"
  persona_bio        = "Derek is a renewable energy researcher who covers solar panel technology, installation costs, utility incentives, and home energy systems. He helps homeowners understand what going solar actually costs and involves — so they can evaluate quotes intelligently and avoid common mistakes."
  persona_initials   = "DS"
  disclaimer         = "This site is for general informational purposes only. Solar system costs, incentives, net metering policies, and payback periods vary significantly by location, utility, and home characteristics. Always obtain multiple quotes from licensed installers and verify incentive eligibility with your utility."

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50
